name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**', 'chore/**', 'redesign/**']
  workflow_dispatch:

# A new push cancels the previous run of the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: gym-tracker-mobile

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            mobile:
              - 'gym-tracker-mobile/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '.github/scripts/**'

  lint:
    name: Lint and format
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mobile
      - name: ESLint (layer rules included)
        run: npm run lint -- --format stylish
      - name: Prettier
        run: npm run format:check

  types:
    name: Types
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mobile
      - name: TypeScript (strict)
        run: npm run type-check

  test:
    name: Tests and coverage
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mobile
      - name: Jest, coverage thresholds
        run: >-
          npm run test:coverage -- --ci --maxWorkers=100%
          --coverageReporters=text-summary --coverageReporters=json-summary --coverageReporters=lcov
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('gym-tracker-mobile/coverage/coverage-summary.json') != '' }}
        run: node ../.github/scripts/coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: gym-tracker-mobile/coverage/
          retention-days: 7
          if-no-files-found: ignore

  doctor:
    name: Expo doctor
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mobile
      # SDK versions, missing native peer dependencies, app config: what breaks a build outside Expo Go
      - run: npx --yes expo-doctor@1

  bundle:
    name: Bundle (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mobile
      # The same bundle the phone gets: a broken import or a missing module fails here
      - name: Export
        run: npx expo export --platform ${{ matrix.platform }} --output-dir dist
      - name: Bundle size
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          js=$(find dist/_expo/static/js -type f -print0 | du -cb --files0-from=- | tail -1 | cut -f1)
          all=$(du -sb dist | cut -f1)
          {
            echo "### Bundle $PLATFORM"
            echo ""
            echo "| | Taille |"
            echo "|---|---|"
            echo "| JavaScript | $(numfmt --to=iec --suffix=B "$js") |"
            echo "| Total (avec les assets) | $(numfmt --to=iec --suffix=B "$all") |"
          } >> "$GITHUB_STEP_SUMMARY"

  fingerprint:
    name: Native fingerprint
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-mobile
      - name: Fingerprint of this PR
        run: npx @expo/fingerprint . > /tmp/head.json
      - name: Fingerprint of the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add /tmp/base "$BASE_SHA"
          cd /tmp/base/gym-tracker-mobile
          npm ci --no-audit --no-fund --ignore-scripts
          npx @expo/fingerprint . > /tmp/base.json
      # An OTA update only ships JavaScript and assets: a native change needs a new store build
      - name: Compare
        run: |
          base=$(jq -r .hash /tmp/base.json)
          head=$(jq -r .hash /tmp/head.json)
          if [ "$base" = "$head" ]; then
            echo "### Natif inchangé" >> "$GITHUB_STEP_SUMMARY"
            echo "Empreinte \`$head\` : cette PR peut partir en mise à jour OTA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Native change::The native fingerprint changed: this PR needs a new EAS build, not an OTA update."
            {
              echo "### Natif modifié : il faudra un nouveau build"
              echo ""
              echo "\`$base\` → \`$head\`"
              echo ""
              echo "Sources qui ont changé :"
              echo ""
              jq -r --slurpfile b /tmp/base.json \
                '[.sources[] | {id: (.filePath // .id), hash}] - [$b[0].sources[] | {id: (.filePath // .id), hash}] | .[] | "- `\(.id)`"' \
                /tmp/head.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The one check to require on main: green when every job above passed or was rightly skipped
  ci-ok:
    name: CI ok
    if: always()
    needs: [changes, lint, types, test, doctor, bundle, fingerprint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then exit 1; fi
          done
