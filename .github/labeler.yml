# One label per layer touched (CLAUDE.md, "Layers"): a reviewer sees at a glance what a PR risks
domain:
  - changed-files:
      - any-glob-to-any-file: gym-tracker-mobile/domain/**
services:
  - changed-files:
      - any-glob-to-any-file: gym-tracker-mobile/services/**
stores:
  - changed-files:
      - any-glob-to-any-file: [gym-tracker-mobile/stores/**, gym-tracker-mobile/hooks/**]
ui:
  - changed-files:
      - any-glob-to-any-file:
          [gym-tracker-mobile/app/**, gym-tracker-mobile/components/**, gym-tracker-mobile/constants/**]
i18n:
  - changed-files:
      - any-glob-to-any-file: gym-tracker-mobile/i18n/**
supabase:
  - changed-files:
      - any-glob-to-any-file: gym-tracker-mobile/supabase/**
native:
  - changed-files:
      - any-glob-to-any-file:
          [gym-tracker-mobile/app.json, gym-tracker-mobile/eas.json, gym-tracker-mobile/package.json]
ci:
  - changed-files:
      - any-glob-to-any-file: .github/**
documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md']

# Kind of change, from the branch prefix (CONTRIBUTING.md): the release notes sections
feature:
  - head-branch: ['^feat/', '^redesign/']
bug:
  - head-branch: ['^fix/']
refactor:
  - head-branch: ['^refactor/']
chore:
  - head-branch: ['^chore/']
