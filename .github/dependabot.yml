version: 2
updates:
  # Une seule PR groupée par semaine : chaque mise à jour passe par la CI
  - package-ecosystem: npm
    directory: /gym-tracker-mobile
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    # Conventional title, so the PR passes the title check
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    labels: [dependencies]
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Les versions Expo / React Native suivent le SDK : on les monte avec `npx expo install --fix`
      - dependency-name: 'expo*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'react-native*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      # Suivent aussi le SDK : `npx expo install --fix`
      - dependency-name: '@expo/*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Majeures pas encore prises en charge par Expo (eslint-config-expo, babel-preset-expo)
      - dependency-name: 'eslint'
        update-types: [version-update:semver-major]
      - dependency-name: '@babel/*'
        update-types: [version-update:semver-major]
  # Actions are pinned by commit SHA: Dependabot moves the SHA and the version comment together
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']
